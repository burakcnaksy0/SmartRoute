spring.application.name=smartroute-backend

# Datasource Configuration
spring.datasource.url=${DATABASE_URL:jdbc:postgresql://localhost:5432/smartroute}
spring.datasource.username=${DATABASE_USER:postgres}
spring.datasource.password=${DATABASE_PASSWORD:password}
spring.datasource.driver-class-name=org.postgresql.Driver

# JPA Configuration
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# Flyway Configuration
spring.flyway.enabled=true
spring.flyway.baseline-on-migrate=true
spring.flyway.baseline-version=0

# Actuator Configuration
management.endpoints.web.exposure.include=health
management.endpoint.health.show-details=always

# Server Port
server.port=${PORT:8082}

# OSM / OSRM API Configurations (no API key required)
# Use public demo servers for development — self-host for production
osrm.baseUrl=${OSRM_BASE_URL:https://router.project-osrm.org}
osm.nominatim.url=${NOMINATIM_URL:https://nominatim.openstreetmap.org}
osm.overpass.url=${OVERPASS_URL:https://overpass-api.de/api/interpreter}
osm.nominatim.userAgent=${NOMINATIM_USER_AGENT:SmartRoute/1.0 (contact@smartroute.app)}

# Hugging Face API Configurations
huggingface.api.key=${HUGGINGFACE_API_KEY:}
huggingface.api.baseUrl=${HUGGINGFACE_API_BASE_URL:https://router.huggingface.co}
huggingface.api.model=${HUGGINGFACE_MODEL:meta-llama/Llama-3.1-8B-Instruct}

# Resilience4j Circuit Breaker Config (OSRM)
resilience4j.circuitbreaker.instances.osrmRoutesApi.registerHealthIndicator=true
resilience4j.circuitbreaker.instances.osrmRoutesApi.slidingWindowSize=10
resilience4j.circuitbreaker.instances.osrmRoutesApi.minimumNumberOfCalls=5
resilience4j.circuitbreaker.instances.osrmRoutesApi.failureRateThreshold=50
resilience4j.circuitbreaker.instances.osrmRoutesApi.waitDurationInOpenState=10000
resilience4j.circuitbreaker.instances.osrmRoutesApi.permittedNumberOfCallsInHalfOpenState=3
resilience4j.circuitbreaker.instances.osrmRoutesApi.automaticTransitionFromOpenToHalfOpenEnabled=true

# Provider Settings
providers.routing=ors
providers.geocoding=geoapify
providers.parking=overpass

# OpenRouteService Settings
routing.ors.base-url=${ORS_BASE_URL:https://api.openrouteservice.org}
routing.ors.api-key=${ORS_API_KEY:eyJvcmciOiI1YjNjZTM1OTc4NTExMTAwMDFjZjYyNDgiLCJpZCI6IjJjYWQzY2NkYzlhMDRmY2JiZTE0ZTZjZGE3YjQzMjQwIiwiaCI6Im11cm11cjY0In0=}

# Geoapify Settings
geocoding.geoapify.base-url=${GEOAPIFY_BASE_URL:https://api.geoapify.com}
geocoding.geoapify.api-key=${GEOAPIFY_API_KEY:08cefc503e144949bbe79fa3512c591b}

# Redis Settings
spring.data.redis.host=${REDIS_HOST:localhost}
spring.data.redis.port=${REDIS_PORT:6379}

# Resilience4j Circuit Breaker Config (ORS)
resilience4j.circuitbreaker.instances.orsRoutesApi.registerHealthIndicator=true
resilience4j.circuitbreaker.instances.orsRoutesApi.slidingWindowSize=10
resilience4j.circuitbreaker.instances.orsRoutesApi.minimumNumberOfCalls=5
resilience4j.circuitbreaker.instances.orsRoutesApi.failureRateThreshold=50
resilience4j.circuitbreaker.instances.orsRoutesApi.waitDurationInOpenState=10000
resilience4j.circuitbreaker.instances.orsRoutesApi.permittedNumberOfCallsInHalfOpenState=3
resilience4j.circuitbreaker.instances.orsRoutesApi.automaticTransitionFromOpenToHalfOpenEnabled=true

