spring.application.name=smartroute-backend

# Datasource Configuration
spring.datasource.url=${DATABASE_URL:jdbc:postgresql://localhost:5432/smartroute}
spring.datasource.username=${DATABASE_USER:postgres}
spring.datasource.password=${DATABASE_PASSWORD:password}
spring.datasource.driver-class-name=org.postgresql.Driver

# JPA Configuration
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# Flyway Configuration
spring.flyway.enabled=true
spring.flyway.baseline-on-migrate=true
spring.flyway.baseline-version=0

# Actuator Configuration
management.endpoints.web.exposure.include=health
management.endpoint.health.show-details=always

# Server Port
server.port=${PORT:8082}

# Google API Configurations
google.api.key=${GOOGLE_API_KEY:mock-key}
google.api.baseUrl=${GOOGLE_API_BASE_URL:https://routes.googleapis.com}

# Resilience4j Circuit Breaker Config
resilience4j.circuitbreaker.instances.googleRoutesApi.registerHealthIndicator=true
resilience4j.circuitbreaker.instances.googleRoutesApi.slidingWindowSize=10
resilience4j.circuitbreaker.instances.googleRoutesApi.minimumNumberOfCalls=5
resilience4j.circuitbreaker.instances.googleRoutesApi.failureRateThreshold=50
resilience4j.circuitbreaker.instances.googleRoutesApi.waitDurationInOpenState=10000
resilience4j.circuitbreaker.instances.googleRoutesApi.permittedNumberOfCallsInHalfOpenState=3
resilience4j.circuitbreaker.instances.googleRoutesApi.automaticTransitionFromOpenToHalfOpenEnabled=true



