name: Mobile CI

on:
  push:
    branches:
      - main
      - develop
      - 'feature/**'
      - 'fix/**'
    paths:
      - 'mobile/**'
  pull_request:
    branches:
      - main
      - develop
    paths:
      - 'mobile/**'

jobs:
  build:
    name: Lint & Typecheck Mobile
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: mobile/package-lock.json

      - name: Install Dependencies
        run: |
          cd mobile
          npm ci

      - name: Run Lint
        run: |
          cd mobile
          npm run lint

      - name: Run Typecheck
        run: |
          cd mobile
          npx tsc --noEmit
