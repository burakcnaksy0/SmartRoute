<script>
  // Simple interactive toggle for Segmented Control (Priority)
  const priorityButtons = document.querySelectorAll('#priority-segments button');
  priorityButtons.forEach(btn => {
    btn.addEventListener('click', (e) => {
      // Reset all
      priorityButtons.forEach(b => {
        b.className = 'flex-1 py-2.5 rounded-[12px] font-label-sm text-label-sm text-on-surface transition-all duration-300 relative z-10';
      });
      // Set active
      let target = e.currentTarget;
      let val = target.getAttribute('data-value');
      
      // Dynamic color based on priority choice to add a moment of delight
      let activeClass = 'bg-primary text-on-primary shadow-sm';
      if(val === 'high') activeClass = 'bg-error text-on-error shadow-sm';
      if(val === 'low') activeClass = 'bg-secondary text-on-secondary shadow-sm';

      target.className = `flex-1 py-2.5 rounded-[12px] font-label-sm text-label-sm ${activeClass} transition-all duration-300 relative z-10`;
    });
  });

  // Simple interactive toggle for Parking Chips
  const parkingChips = document.querySelectorAll('#parking-chips button');
  parkingChips.forEach(chip => {
    chip.addEventListener('click', (e) => {
      parkingChips.forEach(c => {
        c.className = 'flex-1 flex flex-col items-center justify-center py-3 bg-surface-container-highest text-on-surface rounded-[16px] gap-1 transition-all active:scale-95';
        c.querySelector('span.material-symbols-outlined').style.fontVariationSettings = "'FILL' 0";
      });
      let target = e.currentTarget;
      target.className = 'flex-1 flex flex-col items-center justify-center py-3 bg-secondary text-on-secondary rounded-[16px] gap-1 shadow-sm transition-all active:scale-95';
      target.querySelector('span.material-symbols-outlined').style.fontVariationSettings = "'FILL' 1";
    });
  });
