<script>
  const destInput = document.getElementById('destination-input');
  const clearBtn = document.getElementById('clear-dest');
  const optimizeBtn = document.getElementById('optimize-btn');
  const recentDest = document.getElementById('recent-destinations');

  destInput.addEventListener('focus', () => {
    recentDest.classList.remove('hidden');
    // slight scroll up to make room for keyboard
    window.scrollTo({ top: document.getElementById('journey-sheet').offsetTop - 20, behavior: 'smooth' });
  });

  destInput.addEventListener('input', (e) => {
    if (e.target.value.length > 0) {
      clearBtn.classList.remove('hidden');
      optimizeBtn.classList.remove('opacity-50', 'cursor-not-allowed');
    } else {
      clearBtn.classList.add('hidden');
      optimizeBtn.classList.add('opacity-50', 'cursor-not-allowed');
    }
  });

  clearBtn.addEventListener('click', () => {
    destInput.value = '';
    clearBtn.classList.add('hidden');
    optimizeBtn.classList.add('opacity-50', 'cursor-not-allowed');
    destInput.focus();
  });

  function setDestination(name) {
    destInput.value = name;
    clearBtn.classList.remove('hidden');
    optimizeBtn.classList.remove('opacity-50', 'cursor-not-allowed');
    recentDest.classList.add('hidden');
  }

  // Handle outside click to close recents
  document.addEventListener('click', (e) => {
    if (!destInput.contains(e.target) && !recentDest.contains(e.target)) {
      recentDest.classList.add('hidden');
    }
  });
