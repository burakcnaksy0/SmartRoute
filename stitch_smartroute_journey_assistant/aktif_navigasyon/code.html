<script>
    // Simple progress simulation for visual delight
    document.addEventListener('DOMContentLoaded', () => {
        const progressBar = document.getElementById('journey-progress');
        if (progressBar) {
            setTimeout(() => {
                progressBar.style.width = '72%';
            }, 1500);
        }

        // Basic bottom sheet interaction (visual only for shell context)
        const handle = document.getElementById('sheet-handle');
        const container = handle.parentElement;
        
        let startY = 0;
        let currentY = 0;
        let isDragging = false;

        handle.addEventListener('touchstart', (e) => {
            isDragging = true;
            startY = e.touches[0].clientY;
            container.style.transition = 'none';
        }, { passive: true });

        handle.addEventListener('touchmove', (e) => {
            if (!isDragging) return;
            const deltaY = e.touches[0].clientY - startY;
            if (deltaY > 0) { // Only allow dragging down slightly for bounce effect
                currentY = deltaY * 0.3; // Resistance
                container.style.transform = `translateY(${currentY}px)`;
            }
        }, { passive: true });

        handle.addEventListener('touchend', () => {
            isDragging = false;
            container.style.transition = 'transform 0.3s cubic-bezier(0.2, 0.8, 0.2, 1)';
            container.style.transform = 'translateY(0px)';
        });
    });
